name = "Elevated"
description = "Layered/premium: generous rounding, generous spacing, layered shadows"

[tokens.radius]
none = "0"
sm = "8px"
md = "12px"
lg = "20px"
xl = "28px"
full = "9999px"

[tokens.spacing]
scale = 1.15

[tokens.border]
width_thin = "1px"
width_normal = "1px"
width_thick = "2px"
style = "solid"

[tokens.shadow]
sm = "0 2px 8px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)"
md = "0 8px 24px rgba(0,0,0,0.1), 0 2px 8px rgba(0,0,0,0.06)"
lg = "0 16px 48px rgba(0,0,0,0.12), 0 4px 12px rgba(0,0,0,0.08)"
xl = "0 24px 64px rgba(0,0,0,0.15), 0 8px 24px rgba(0,0,0,0.1)"

[tokens.typography]
font_primary = "var(--font-body, system-ui)"
leading_scale = "1.06"
