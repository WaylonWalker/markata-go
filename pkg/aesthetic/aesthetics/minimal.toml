name = "Minimal"
description = "Airy and flat: restrained corners, generous spacing, no shadows"

[tokens.radius]
none = "0"
sm = "4px"
md = "6px"
lg = "10px"
xl = "14px"
full = "9999px"

[tokens.spacing]
scale = 1.2

[tokens.border]
width_thin = "1px"
width_normal = "1px"
width_thick = "1px"
style = "solid"

[tokens.shadow]
sm = "none"
md = "none"
lg = "none"
xl = "none"

[tokens.typography]
font_primary = "var(--font-body, system-ui)"
leading_scale = "1.03"
