name = "Brutal"
description = "Brutalist design: sharp corners, tight spacing, thick borders, hard shadows"

[tokens.radius]
none = "0"
sm = "0"
md = "0"
lg = "0"
xl = "0"
full = "0"

[tokens.spacing]
scale = 0.85

[tokens.border]
width_thin = "2px"
width_normal = "3px"
width_thick = "4px"
style = "solid"

[tokens.shadow]
sm = "none"
md = "4px 4px 0 var(--color-primary, var(--color-border))"
lg = "6px 6px 0 var(--color-primary, var(--color-border))"
xl = "8px 8px 0 var(--color-primary, var(--color-border))"

[tokens.typography]
font_primary = "var(--font-mono, monospace)"
leading_scale = "0.94"
