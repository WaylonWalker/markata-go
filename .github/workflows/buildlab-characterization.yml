name: Build Lab characterization

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - "cmd/markata-go/**"
      - "internal/**"
      - "pkg/**"
      - "templates/**"
      - "tests/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  characterize:
    name: Observe Build Lab mutations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run observational Build Lab characterization
        run: go test -v -race -timeout=30m -coverprofile=coverage.out -covermode=atomic ./cmd/markata-go/cmd -run '^TestBuildLab_LinkedAndFixtureMutationsCharacterizeProduct$'
