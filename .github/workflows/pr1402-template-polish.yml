name: PR 1402 template parity

on:
  push:
    branches:
      - feat/configurable-feed-views-1390

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/configurable-feed-views-1390
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Align root and packaged feed templates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          # Document nil/unset inheritance precisely; explicit empty is invalid.
          one('pkg/models/feed.go',
              '// Empty inherits FeedDefaults.Views.',
              '// Nil/unset inherits FeedDefaults.Views; an explicit empty list is invalid.')

          # Avoid calendar-only hooks when the calendar presentation is disabled.
          one('pkg/themes/default/templates/feed.html',
              '<p class="feed-empty" data-calendar-primary>',
              '<p class="feed-empty"{% if feed.views.calendar %} data-calendar-primary{% endif %}>')

          for path, label in (
              ('templates/feed.html', 'Posts'),
              ('templates/feed-photo-grid.html', 'Grid'),
          ):
              old = f'''        {{% if feed.posts %}}\n        <nav class="calendar-view-switch" data-calendar-switch hidden aria-label="Feed views">\n          <button type="button" data-calendar-mode="list" aria-pressed="true">{label}</button>\n          {{% if feed.views.simple and feed.formats.simple_html %}}<a class="feed-view-link" href="{{% if feed.slug %}}/{{{{ feed.slug }}}}/simple/{{% else %}}/simple/{{% endif %}}">Simple</a>{{% endif %}}\n          <button type="button" data-calendar-mode="calendar" aria-pressed="false">Calendar</button>\n        </nav>\n        {{% endif %}}'''
              new = f'''        {{% if feed.posts %}}\n        {{% if feed.views.calendar %}}\n        <nav class="calendar-view-switch" data-calendar-switch hidden aria-label="Feed views">\n          <button type="button" data-calendar-mode="list" aria-pressed="true">{label}</button>\n          {{% if feed.views.simple and feed.formats.simple_html %}}<a class="feed-view-link" href="{{% if feed.slug %}}/{{{{ feed.slug }}}}/simple/{{% else %}}/simple/{{% endif %}}">Simple</a>{{% endif %}}\n          <button type="button" data-calendar-mode="calendar" aria-pressed="false">Calendar</button>\n        </nav>\n        {{% elif feed.views.simple and feed.formats.simple_html %}}\n        <nav class="feed-view-links" aria-label="Feed views"><span aria-current="page">{label}</span> <a class="feed-view-link" href="{{% if feed.slug %}}/{{{{ feed.slug }}}}/simple/{{% else %}}/simple/{{% endif %}}">Simple</a></nav>\n        {{% endif %}}\n        {{% endif %}}'''
              one(path, old, new)

          one('templates/feed.html',
              '<div class="posts posts-list" id="posts-list" data-calendar-primary>',
              '<div class="posts posts-list" id="posts-list"{% if feed.views.calendar %} data-calendar-primary{% endif %}>')
          one('templates/feed.html',
              '<p class="feed-empty" data-calendar-primary>',
              '<p class="feed-empty"{% if feed.views.calendar %} data-calendar-primary{% endif %}>')
          one('templates/feed-photo-grid.html',
              '<div class="posts posts-list posts-list--photo-grid" id="posts-list" data-calendar-primary>',
              '<div class="posts posts-list posts-list--photo-grid" id="posts-list"{% if feed.views.calendar %} data-calendar-primary{% endif %}>')

          # Keep the new docs tidy.
          for path in ('docs/guides/feed-views.md', 'spec/spec/FEED_VIEWS.md'):
              p = Path(path)
              p.write_text(p.read_text().lstrip('\n'))
          PY
          gofmt -w pkg/models/feed.go
          go test ./pkg/models ./pkg/config ./pkg/templates ./pkg/plugins
      - name: Commit source polish
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg templates docs spec
          git commit -m "fix(feeds): align view opt-outs across templates"
          git push origin HEAD:feat/configurable-feed-views-1390
