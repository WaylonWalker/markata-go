name: Phase 3C sidebar benchmark (isolated)
on:
  push:
    branches:
      - perf/phase3c-sidebar-benchmark
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3c-sidebar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PHASE3C_PAIRS: "5"
      PHASE3C_OBSERVE_MS: "55000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated test tools
        run: |
          python -m pip install --disable-pip-version-check playwright==1.58.0 aiohttp==3.13.3 requests==2.32.5 brotli==1.2.0
          python -m playwright install chromium
      - name: Run live-snapshot source-order comparison (five alternating pairs)
        run: python -u scripts/phase3c_remote_ab.py
      - name: Upload immutable benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3c-sidebar-evidence
          path: phase3c-evidence/
          if-no-files-found: warn
          retention-days: 14
