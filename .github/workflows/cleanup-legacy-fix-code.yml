name: Remove retired single-file fix code

on:
  push:
    branches:
      - feat/serve-fix-plans
    paths:
      - .github/workflows/cleanup-legacy-fix-code.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/serve-fix-plans
          fetch-depth: 0
      - name: Remove obsolete handlers and helpers
        shell: python
        run: |
          from pathlib import Path

          path = Path("pkg/servecontrol/web.go")
          source = path.read_text()

          start = source.find("func fixPreviewHandler(sourceRoot string) http.HandlerFunc {")
          end = source.find("func requestScheme(r *http.Request) string {", start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate retired single-file handler block")
          source = source[:start] + source[end:]

          start = source.find("func decodeJSON(w http.ResponseWriter, r *http.Request, dst any) error {")
          end = source.find("func sameOriginLocalRequest(r *http.Request, scheme string) bool {", start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate retired decodeJSON helper")
          source = source[:start] + source[end:]

          source = source.replace('\t"fmt"\n', '')
          source = source.replace('\t"os"\n', '')
          path.write_text(source)
      - name: Format and verify focused packages
        run: |
          gofmt -w pkg/servecontrol/web.go
          go test ./pkg/servecontrol ./pkg/servefix
      - name: Commit cleanup
        run: |
          rm .github/workflows/cleanup-legacy-fix-code.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Remove retired single-file fix handlers"
          git push origin HEAD:feat/serve-fix-plans
