name: Apply issue 1507 implementation

on:
  push:
    branches:
      - fix/1507-external-obsidian-embeds

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/1507-external-obsidian-embeds
          fetch-depth: 0
      - name: Apply focused embed parser fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('pkg/plugins/embeds.go')
          text = path.read_text()

          old_guard = '''\t\tif filename == "" {\n\t\t\treturn match\n\t\t}\n'''
          new_guard = '''\t\tif filename == "" || isExternalEmbedURL(filename) {\n\t\t\treturn match\n\t\t}\n'''
          if text.count(old_guard) != 1:
              raise SystemExit(f'expected one attachment guard, found {text.count(old_guard)}')
          text = text.replace(old_guard, new_guard, 1)

          old_version = '''\toembedCacheVersion = "v2"\n\t// v3 invalidates transformed embed cards so the external-card marker is\n\t// added to content restored from an older cache.\n\tembedsCacheVersion = "v3"\n'''
          new_version = '''\toembedCacheVersion = "v2"\n\t// v4 invalidates transformed content so absolute Obsidian-style HTTP(S)\n\t// embeds previously rewritten as local attachments are processed again.\n\tembedsCacheVersion = "v4"\n'''
          if text.count(old_version) != 1:
              raise SystemExit(f'expected one embed cache version block, found {text.count(old_version)}')
          text = text.replace(old_version, new_version, 1)
          path.write_text(text)

          Path('.github/workflows/apply-1507.yml').unlink()
          PY
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/plugins/embeds.go .github/workflows/apply-1507.yml
          git commit -m 'fix(embeds): preserve external Obsidian URLs'
          git push origin HEAD:fix/1507-external-obsidian-embeds
