name: Apply final 1304 review fix

on:
  push:
    branches:
      - feat/serve-fix-plans
    paths:
      - .github/workflows/patch-1304.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/serve-fix-plans
          fetch-depth: 0
      - name: Retire legacy single-file fix routes
        shell: python
        run: |
          from pathlib import Path

          web = Path("pkg/servecontrol/web.go")
          source = web.read_text()
          legacy = [
              '\tmux.HandleFunc("/_markata/api/fixes/preview", fixPreviewHandler(sourceRoot))\n',
              '\tmux.HandleFunc("/_markata/api/fixes/apply", fixApplyHandler(sourceRoot))\n',
          ]
          for line in legacy:
              if source.count(line) != 1:
                  raise SystemExit(f"expected exactly one legacy route: {line!r}")
              source = source.replace(line, "")
          web.write_text(source)

          tests = Path("pkg/servecontrol/web_test.go")
          source = tests.read_text()
          start_marker = "func TestWebHandler_FixPreviewApplyAndStaleProtection(t *testing.T) {"
          end_marker = "\nfunc TestWebHandler_BatchFixSkipsStaleAndRequestsOneBuild"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("could not locate legacy single-file route test")
          replacement = '''func TestWebHandler_LegacySingleFileFixRoutesAreRetired(t *testing.T) {
          \troot := t.TempDir()
          \thandler := NewWebHandlerWithSourceRoot(NewRuntime(), root)
          \tfor _, route := range []string{"/_markata/api/fixes/preview", "/_markata/api/fixes/apply"} {
          \t\tresponse := serveLocalPost(handler, route, []byte(`{}`))
          \t\tif response.Code != http.StatusNotFound {
          \t\t\tt.Fatalf("%s status = %d, want %d", route, response.Code, http.StatusNotFound)
          \t\t}
          \t}
          }
          '''
          source = source[:start] + replacement + source[end:]
          tests.write_text(source)

          Path(".github/workflows/patch-1304.yml").unlink()
      - name: Format and verify focused packages
        run: |
          gofmt -w pkg/servecontrol/web.go pkg/servecontrol/web_test.go
          go test ./pkg/servecontrol ./pkg/servefix
      - name: Commit final review fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/servecontrol/web.go pkg/servecontrol/web_test.go .github/workflows/patch-1304.yml
          git commit -m "Retire legacy single-file fix endpoints"
          git push origin HEAD:feat/serve-fix-plans
