name: One-shot release v0.13.0

on:
  push:
    branches:
      - release/v0.13.0

permissions:
  contents: write
  packages: write
  id-token: write

env:
  GO_VERSION: "1.26"
  RELEASE_TAG: "v0.13.0"
  RELEASE_SHA: "38e7f712019e9c96a8126274de625258da0c9d2d"

jobs:
  release:
    name: Release v0.13.0
    runs-on: ubuntu-latest
    steps:
      - name: Verify main has not moved
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git ls-remote https://github.com/${GITHUB_REPOSITORY}.git refs/heads/main | cut -f1)"
          if [[ "$actual" != "$RELEASE_SHA" ]]; then
            echo "main moved: expected $RELEASE_SHA, got $actual" >&2
            exit 1
          fi

      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run release test suite
        run: go test -v -race ./...

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Create and push release tag
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "$RELEASE_TAG"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-v0.13.0
          path: dist/*
          retention-days: 30
