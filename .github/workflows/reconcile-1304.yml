name: Reconcile 1304 with current main

on:
  push:
    branches:
      - feat/serve-fix-plans
    paths:
      - .github/workflows/reconcile-1304.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/serve-fix-plans
          fetch-depth: 0
      - name: Configure git and merge current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo "main merged without conflicts"
          else
            unmerged="$(git diff --name-only --diff-filter=U)"
            if [ "$unmerged" != "pkg/servecontrol/web.go" ]; then
              echo "unexpected merge conflicts:"
              printf '%s\n' "$unmerged"
              exit 1
            fi
            git checkout --ours pkg/servecontrol/web.go
          fi
      - name: Reapply Problems clipboard report to grouped-fix dashboard
        shell: python
        run: |
          from pathlib import Path

          path = Path("pkg/servecontrol/web.go")
          source = path.read_text()

          if 'id="copy-report-button"' not in source:
              old = '<a class="site-link" id="site-link" hidden target="_blank" rel="noopener">Open site ↗</a><button class="button primary" id="build-button"'
              new = '<a class="site-link" id="site-link" hidden target="_blank" rel="noopener">Open site ↗</a><button class="button" id="copy-report-button" type="button" hidden>Copy report</button><button class="button primary" id="build-button"'
              if source.count(old) != 1:
                  raise SystemExit("could not locate mast action insertion point")
              source = source.replace(old, new)

          if 'function diagnosticReport(items)' not in source:
              marker = 'function moveSelection(delta)'
              index = source.find(marker)
              if index < 0:
                  raise SystemExit("could not locate diff navigation insertion point")
              report = "function diagnosticReport(items){const warnings=items.filter(item=>item.severity==='warning').length,errors=items.filter(item=>item.severity==='error').length,lines=['# Markata Problems Report','',items.length+' problem'+(items.length===1?'':'s')+' ('+errors+' errors, '+warnings+' warnings)'];if(state.severity)lines.push('Severity filter: '+state.severity);if(state.filter)lines.push('Text filter: '+state.filter);if(!items.length){lines.push('','No matching problems.');return lines.join('\\n')}items.forEach((item,index)=>{const location=[item.file||item.page,item.line,item.column].filter(value=>value!==undefined&&value!==null&&value!=='').join(':');lines.push('',(index+1)+'. ['+String(item.severity||'problem').toUpperCase()+'] '+(item.code?item.code+' — ':'')+(item.message||'Problem'));if(location)lines.push('   Location: '+location);if(item.explanation)lines.push('   Explanation: '+item.explanation);if(item.suggested_fix)lines.push('   Suggested fix: '+item.suggested_fix);if(item.job_id)lines.push('   Job: '+item.job_id);if(item.step_id)lines.push('   Step: '+item.step_id)});return lines.join('\\n')}\n"
              report += "async function copyProblemReport(){const items=visibleItems().map(x=>x.item),report=diagnosticReport(items);if(!navigator.clipboard||!navigator.clipboard.writeText){notice('Clipboard access is unavailable in this browser.');return}try{await navigator.clipboard.writeText(report);notice('Copied '+items.length+' problem'+(items.length===1?'':'s')+' to clipboard.')}catch(err){notice('Could not copy problem report: '+(err&&err.message?err.message:'clipboard write failed'))}}\n"
              source = source[:index] + report + source[index:]

          toggle = "el('copy-report-button').hidden=state.section!=='diagnostics';"
          if toggle not in source:
              old = "nav(el('desktop-nav'));nav(el('mobile-nav'));status();el('title')"
              new = "nav(el('desktop-nav'));nav(el('mobile-nav'));status();" + toggle + "el('title')"
              if source.count(old) != 1:
                  raise SystemExit("could not locate render toggle insertion point")
              source = source.replace(old, new)

          listener = "el('copy-report-button').addEventListener('click',copyProblemReport);"
          if listener not in source:
              old = "el('build-button').hidden=!capabilities.build;"
              if source.count(old) != 1:
                  raise SystemExit("could not locate clipboard listener insertion point")
              source = source.replace(old, listener + old)

          path.write_text(source)
      - name: Verify merged Control Center
        run: |
          git add pkg/servecontrol/web.go
          if git diff --name-only --diff-filter=U | grep -q .; then
            git diff --name-only --diff-filter=U
            exit 1
          fi
          gofmt -w pkg/servecontrol/web.go
          go test ./pkg/servecontrol ./pkg/servefix
      - name: Commit reconciliation
        run: |
          rm .github/workflows/reconcile-1304.yml
          git add -A
          git commit -m "Reconcile grouped fixes with current Control Center"
          git push origin HEAD:feat/serve-fix-plans
