# CI workflow for markata-go
# Runs on every push and pull request

name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  LINT_GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  manifest-completeness:
    name: Font Manifest Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Check bundled manifests
        run: ./scripts/generate_font_manifests.py --completeness

  manifest-generation:
    name: Font Manifest Determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Fetch pinned Google Fonts sources
        env:
          GOOGLE_FONTS: vendor/google-fonts
        run: |
          revision=$(uv run --with pyyaml python -c 'import yaml; print(yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml"))["revision"])')
          directories=$(uv run --with pyyaml python -c 'import yaml; lock=yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml")); print("\n".join(sorted({source["directory"] for source in lock["sources"].values()})))')
          mkdir -p "$GOOGLE_FONTS"
          git -C "$GOOGLE_FONTS" init
          git -C "$GOOGLE_FONTS" remote add origin https://github.com/google/fonts.git
          git -C "$GOOGLE_FONTS" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$GOOGLE_FONTS" sparse-checkout init --cone
          git -C "$GOOGLE_FONTS" sparse-checkout set --stdin <<< "$directories"
          git -C "$GOOGLE_FONTS" checkout --detach FETCH_HEAD
      - name: Regenerate and compare manifests from pinned source
        run: ./scripts/generate_font_manifests.py --check

  rendering-contract:
    name: Rendering Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check generated rendering contract artifacts
        run: go run ./scripts/rendering-contract --check

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (linux with race + coverage)
        if: matrix.os == 'ubuntu-latest'
        run: go test -v -race "-coverprofile=coverage.out" -covermode=atomic ./...

      - name: Run tests (windows short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'windows-latest'
        run: go test -v -short ./...

      - name: Run tests (macOS short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'macos-latest'
        run: go test -v -short ./...

      - name: Run tests (non-linux full)
        if: github.event_name != 'pull_request' && github.event_name != 'push' && matrix.os != 'ubuntu-latest'
        run: go test -v ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.26'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          go build -v -ldflags="-s -w" -o markata-go ./cmd/markata-go

      - name: Verify binary
        run: |
          ./markata-go version
          ./markata-go --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markata-go-linux-amd64
          path: markata-go
          retention-days: 7

  # Snapshot build to verify goreleaser config
  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
