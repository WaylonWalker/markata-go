# CI workflow for markata-go
# Runs on every push and pull request

name: CI

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - "*.md"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    - cron: "23 8 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  LINT_GO_VERSION: "1.26"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.LINT_GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: golangci-lint run --timeout=5m

  manifest-completeness:
    name: Font Manifest Completeness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Check bundled manifests
        run: ./scripts/generate_font_manifests.py --completeness

  manifest-generation:
    name: Font Manifest Determinism
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Fetch pinned Google Fonts sources
        env:
          GOOGLE_FONTS: vendor/google-fonts
        run: |
          revision=$(uv run --with pyyaml python -c 'import yaml; print(yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml"))["revision"])')
          directories=$(uv run --with pyyaml python -c 'import yaml; lock=yaml.safe_load(open("internal/fontcatalog/markata-fonts.lock.yaml")); print("\n".join(sorted({source["directory"] for source in lock["sources"].values()})))')
          mkdir -p "$GOOGLE_FONTS"
          git -C "$GOOGLE_FONTS" init
          git -C "$GOOGLE_FONTS" remote add origin https://github.com/google/fonts.git
          git -C "$GOOGLE_FONTS" fetch --depth=1 --filter=blob:none origin "$revision"
          git -C "$GOOGLE_FONTS" sparse-checkout init --cone
          git -C "$GOOGLE_FONTS" sparse-checkout set --stdin <<< "$directories"
          git -C "$GOOGLE_FONTS" checkout --detach FETCH_HEAD
      - name: Regenerate and compare manifests from pinned source
        run: ./scripts/generate_font_manifests.py --check

  rendering-contract:
    name: Rendering Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Check generated rendering contract artifacts
        run: go run ./scripts/rendering-contract --check

  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Helm
        uses: azure/setup-helm@v5
      - name: Lint Helm chart
        run: helm lint helm-chart
      - name: Test nginx CORS behavior
        run: ./helm-chart/tests/nginx-cors.sh

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        go: ["1.26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests (windows short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'windows-latest'
        run: go test -v -short ./...

      - name: Run tests (macOS short)
        if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'macos-latest'
        run: go test -v -short ./...

      - name: Run tests (non-linux full)
        if: github.event_name != 'pull_request' && github.event_name != 'push'
        run: go test -v ./...

  test-linux-core:
    name: Linux tests (core)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download the CLI built from this checkout
        uses: actions/download-artifact@v7
        with:
          name: markata-go-linux-amd64
          path: ${{ runner.temp }}

      - name: Configure the checked-out CLI binary
        run: |
          binary="$RUNNER_TEMP/markata-go"
          chmod +x "$binary"
          printf 'MARKATA_GO_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
          printf 'MARKATA_GO_TEST_BINARY_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run core tests (race + coverage)
        run: |
          go list ./... > "$RUNNER_TEMP/all-packages.txt"
          mapfile -t all_packages < "$RUNNER_TEMP/all-packages.txt"
          packages=()
          for package in "${all_packages[@]}"; do
            case "$package" in
              github.com/WaylonWalker/markata-go/cmd/markata-go/cmd|github.com/WaylonWalker/markata-go/pkg/search|github.com/WaylonWalker/markata-go/pkg/searchapi|github.com/WaylonWalker/markata-go/tests)
                continue
                ;;
            esac
            packages+=("$package")
          done
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "No core Go test packages were selected" >&2
            exit 1
          fi
          go test -v -race -timeout=30m -coverprofile=coverage-core.out -covermode=atomic "${packages[@]}"

      - name: Upload core coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-core.out
          fail_ci_if_error: false

  test-linux-integration:
    name: Linux tests (integration)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Download the CLI built from this checkout
        uses: actions/download-artifact@v7
        with:
          name: markata-go-linux-amd64
          path: ${{ runner.temp }}

      - name: Configure the checked-out CLI binary
        run: |
          binary="$RUNNER_TEMP/markata-go"
          chmod +x "$binary"
          printf 'MARKATA_GO_TEST_BINARY=%s\n' "$binary" >> "$GITHUB_ENV"
          printf 'MARKATA_GO_TEST_BINARY_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Run integration tests (race + coverage, excluding observational Build Lab)
        if: github.event_name == 'pull_request'
        run: go test -v -race -timeout=30m -coverprofile=coverage-integration.out -covermode=atomic -skip '^TestBuildLab_LinkedAndFixtureMutationsCharacterizeProduct$' ./cmd/markata-go/cmd ./pkg/search ./pkg/searchapi ./tests

      - name: Run integration tests (race + coverage)
        if: github.event_name != 'pull_request'
        run: go test -v -race -timeout=30m -coverprofile=coverage-integration.out -covermode=atomic ./cmd/markata-go/cmd ./pkg/search ./pkg/searchapi ./tests

      - name: Upload integration coverage
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage-integration.out
          fail_ci_if_error: false

  test-linux:
    name: Test (ubuntu-latest, 1.26)
    runs-on: ubuntu-latest
    if: always()
    needs:
      - test-linux-core
      - test-linux-integration
    steps:
      - name: Check Linux test shards
        env:
          CORE_RESULT: ${{ needs.test-linux-core.result }}
          INTEGRATION_RESULT: ${{ needs.test-linux-integration.result }}
        run: |
          if [[ "$CORE_RESULT" != "success" || "$INTEGRATION_RESULT" != "success" ]]; then
            printf 'Linux test shards failed: core=%s integration=%s\n' "$CORE_RESULT" "$INTEGRATION_RESULT" >&2
            exit 1
          fi
          echo "All Linux race and coverage test shards passed"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        run: |
          go build -v -ldflags="-s -w" -o markata-go ./cmd/markata-go

      - name: Verify binary
        run: |
          ./markata-go version
          ./markata-go --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: markata-go-linux-amd64
          path: markata-go
          retention-days: 7

  # Snapshot build to verify goreleaser config
  goreleaser-check:
    name: GoReleaser Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check
