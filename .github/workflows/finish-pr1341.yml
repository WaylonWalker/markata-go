          Path("pkg/builderadmin/workspace.go").write_text(r'''package builderadmin

import (
    "fmt"
    "io"
    "io/fs"
    "os"
    "path/filepath"
    "time"
)

type workspaceRenameFunc func(string, string) error

// promoteWorkspaceRelease keeps the same-filesystem rename fast path. If the
// workspace cannot be renamed into the release filesystem (most notably an
// emptyDir/hostPath cross-filesystem move), it falls back to staged copying.
func promoteWorkspaceRelease(workspace, releasesDir, releaseID string) (string, error) {
    return promoteWorkspaceReleaseWithRename(workspace, releasesDir, releaseID, os.Rename)
}

func promoteWorkspaceReleaseWithRename(workspace, releasesDir, releaseID string, rename workspaceRenameFunc) (string, error) {
    if workspace == "" || releasesDir == "" || releaseID == "" {
        return "", fmt.Errorf("workspace, releases directory, and release ID are required")
    }
    if info, err := os.Stat(workspace); err != nil {
        return "", fmt.Errorf("stat build workspace: %w", err)
    } else if !info.IsDir() {
        return "", fmt.Errorf("build workspace is not a directory: %s", workspace)
    }
    if err := os.MkdirAll(releasesDir, 0o755); err != nil {
        return "", fmt.Errorf("create releases directory: %w", err)
    }
    finalPath := filepath.Join(releasesDir, releaseID)
    if _, err := os.Lstat(finalPath); err == nil {
        return "", fmt.Errorf("release already exists: %s", finalPath)
    } else if !os.IsNotExist(err) {
        return "", fmt.Errorf("stat release destination: %w", err)
    }

    renameErr := rename(workspace, finalPath)
    if renameErr == nil {
        return finalPath, nil
    }
    stagedPath, stageErr := stageWorkspaceRelease(workspace, releasesDir, releaseID)
    if stageErr != nil {
        return "", fmt.Errorf("rename build workspace: %v; staged promotion: %w", renameErr, stageErr)
    }
    return stagedPath, nil
}

// stageWorkspaceRelease copies a completed build workspace into a temporary
// directory on the release filesystem, then atomically renames that directory
// into the final retained release path. The atomic guarantee is about release
// visibility: an incomplete copied tree never appears at the final release path.
//
// The source workspace is intentionally left intact. The caller owns workspace
// cleanup so a failed promotion can retain the build output for diagnosis.
func stageWorkspaceRelease(workspace, releasesDir, releaseID string) (string, error) {
    if workspace == "" || releasesDir == "" || releaseID == "" {
        return "", fmt.Errorf("workspace, releases directory, and release ID are required")
    }
    if info, err := os.Stat(workspace); err != nil {
        return "", fmt.Errorf("stat build workspace: %w", err)
    } else if !info.IsDir() {
        return "", fmt.Errorf("build workspace is not a directory: %s", workspace)
    }
    if err := os.MkdirAll(releasesDir, 0o755); err != nil {
        return "", fmt.Errorf("create releases directory: %w", err)
    }

    finalPath := filepath.Join(releasesDir, releaseID)
    if _, err := os.Lstat(finalPath); err == nil {
        return "", fmt.Errorf("release already exists: %s", finalPath)
    } else if !os.IsNotExist(err) {
        return "", fmt.Errorf("stat release destination: %w", err)
    }

    stagingPath, err := os.MkdirTemp(releasesDir, ".staging-"+releaseID+"-")
    if err != nil {
        return "", fmt.Errorf("create release staging directory: %w", err)
    }
    committed := false
    defer func() {
        if !committed {
            _ = os.RemoveAll(stagingPath)
        }
    }()

    if err := copyWorkspaceTree(workspace, stagingPath); err != nil {
        return "", fmt.Errorf("stage build workspace: %w", err)
    }
    if err := os.Rename(stagingPath, finalPath); err != nil {
        return "", fmt.Errorf("commit staged release: %w", err)
    }
    committed = true
    return finalPath, nil
}

func copyWorkspaceTree(source, destination string) error {
    return filepath.WalkDir(source, func(path string, entry fs.DirEntry, walkErr error) error {
        if walkErr != nil {
            return walkErr
        }
        relative, err := filepath.Rel(source, path)
        if err != nil {
            return err
        }
        if relative == "." {
            return nil
        }
        target := filepath.Join(destination, relative)
        info, err := entry.Info()
        if err != nil {
            return err
        }

        if entry.Type()&os.ModeSymlink != 0 {
            linkTarget, err := os.Readlink(path)
            if err != nil {
                return err
            }
            if err := os.MkdirAll(filepath.Dir(target), 0o755); err != nil {
                return err
            }
            return os.Symlink(linkTarget, target)
        }
        if entry.IsDir() {
            if err := os.MkdirAll(target, info.Mode().Perm()); err != nil {
                return err
            }
            return os.Chtimes(target, info.ModTime(), info.ModTime())
        }
        if !entry.Type().IsRegular() {
            return fmt.Errorf("unsupported workspace entry %s (%s)", path, entry.Type())
        }
        return copyWorkspaceFile(path, target, info.Mode().Perm(), info.ModTime())
    })
}

func copyWorkspaceFile(source, destination string, mode fs.FileMode, modTime time.Time) error {
    if err := os.MkdirAll(filepath.Dir(destination), 0o755); err != nil {
        return err
    }
    input, err := os.Open(source)
    if err != nil {
        return err
    }
    defer input.Close()

    output, err := os.OpenFile(destination, os.O_CREATE|os.O_EXCL|os.O_WRONLY, mode)
    if err != nil {
        return err
    }
    copied := false
    defer func() {
        _ = output.Close()
        if !copied {
            _ = os.Remove(destination)
        }
    }()
    if _, err := io.Copy(output, input); err != nil {
        return err
    }
    if err := output.Sync(); err != nil {
        return err
    }
    if err := output.Close(); err != nil {
        return err
    }
    if err := os.Chtimes(destination, modTime, modTime); err != nil {
        return err
    }
    copied = true
    return nil
}
''')

          Path("pkg/builderadmin/workspace_test.go").write_text(r'''package builderadmin

import (
    "errors"
    "os"
    "path/filepath"
    "runtime"
    "strings"
    "testing"
)

func writeWorkspaceFixture(t *testing.T, workspace string) {
    t.Helper()
    if err := os.MkdirAll(filepath.Join(workspace, "post"), 0o755); err != nil {
        t.Fatal(err)
    }
    if err := os.WriteFile(filepath.Join(workspace, "post", "index.html"), []byte("<h1>hello</h1>"), 0o640); err != nil {
        t.Fatal(err)
    }
    if runtime.GOOS != "windows" {
        if err := os.Symlink("post/index.html", filepath.Join(workspace, "index-link.html")); err != nil {
            t.Fatal(err)
        }
    }
}

func assertWorkspaceRelease(t *testing.T, finalPath string) {
    t.Helper()
    content, err := os.ReadFile(filepath.Join(finalPath, "post", "index.html"))
    if err != nil {
        t.Fatal(err)
    }
    if string(content) != "<h1>hello</h1>" {
        t.Fatalf("copied content = %q", content)
    }
}

func TestPromoteWorkspaceReleaseUsesRenameFastPath(t *testing.T) {
    root := t.TempDir()
    workspace := filepath.Join(root, "workspace")
    releases := filepath.Join(root, "releases")
    writeWorkspaceFixture(t, workspace)
    called := false
    finalPath, err := promoteWorkspaceReleaseWithRename(workspace, releases, "release-1", func(oldPath, newPath string) error {
        called = true
        return os.Rename(oldPath, newPath)
    })
    if err != nil {
        t.Fatal(err)
    }
    if !called {
        t.Fatal("rename fast path was not attempted")
    }
    assertWorkspaceRelease(t, finalPath)
    if _, err := os.Stat(workspace); !os.IsNotExist(err) {
        t.Fatalf("same-filesystem rename should consume workspace, stat err = %v", err)
    }
}

func TestPromoteWorkspaceReleaseFallsBackToStagedCopy(t *testing.T) {
    root := t.TempDir()
    workspace := filepath.Join(root, "workspace")
    releases := filepath.Join(root, "releases")
    writeWorkspaceFixture(t, workspace)
    finalPath, err := promoteWorkspaceReleaseWithRename(workspace, releases, "release-1", func(string, string) error {
        return errors.New("cross-device rename")
    })
    if err != nil {
        t.Fatal(err)
    }
    assertWorkspaceRelease(t, finalPath)
    if _, err := os.Stat(workspace); err != nil {
        t.Fatalf("staged fallback should leave source workspace for caller cleanup: %v", err)
    }
    entries, err := os.ReadDir(releases)
    if err != nil {
        t.Fatal(err)
    }
    for _, entry := range entries {
        if strings.HasPrefix(entry.Name(), ".staging-") {
            t.Fatalf("staging directory leaked after commit: %s", entry.Name())
        }
    }
}

func TestStageWorkspaceReleaseCopiesSymlink(t *testing.T) {
    if runtime.GOOS == "windows" {
        t.Skip("symlink creation requires Windows developer mode or elevated privileges")
    }
    root := t.TempDir()
    workspace := filepath.Join(root, "workspace")
    releases := filepath.Join(root, "releases")
    writeWorkspaceFixture(t, workspace)
    finalPath, err := stageWorkspaceRelease(workspace, releases, "release-1")
    if err != nil {
        t.Fatal(err)
    }
    target, err := os.Readlink(filepath.Join(finalPath, "index-link.html"))
    if err != nil {
        t.Fatal(err)
    }
    if target != "post/index.html" {
        t.Fatalf("symlink target = %q", target)
    }
}

func TestStageWorkspaceReleaseDoesNotOverwriteExistingRelease(t *testing.T) {
    root := t.TempDir()
    workspace := filepath.Join(root, "workspace")
    releases := filepath.Join(root, "releases")
    finalPath := filepath.Join(releases, "release-1")
    if err := os.MkdirAll(workspace, 0o755); err != nil {
        t.Fatal(err)
    }
    if err := os.WriteFile(filepath.Join(workspace, "index.html"), []byte("new"), 0o644); err != nil {
        t.Fatal(err)
    }
    if err := os.MkdirAll(finalPath, 0o755); err != nil {
        t.Fatal(err)
    }
    if err := os.WriteFile(filepath.Join(finalPath, "index.html"), []byte("old"), 0o644); err != nil {
        t.Fatal(err)
    }
    if _, err := stageWorkspaceRelease(workspace, releases, "release-1"); err == nil {
        t.Fatal("stageWorkspaceRelease() succeeded over an existing release")
    }
    content, err := os.ReadFile(filepath.Join(finalPath, "index.html"))
    if err != nil {
        t.Fatal(err)
    }
    if string(content) != "old" {
        t.Fatalf("existing release was modified: %q", content)
    }
}

func TestStageWorkspaceReleaseRejectsMissingWorkspace(t *testing.T) {
    root := t.TempDir()
    if _, err := stageWorkspaceRelease(filepath.Join(root, "missing"), filepath.Join(root, "releases"), "release-1"); err == nil {
        t.Fatal("stageWorkspaceRelease() succeeded with missing workspace")
    }
}

func TestPrepareBuildUsesConfiguredWorkDir(t *testing.T) {
    root := t.TempDir()
    siteDir := filepath.Join(root, "site")
    workDir := filepath.Join(root, "fast-work", "build")
    sourceDir := filepath.Join(root, "source")
    if err := os.MkdirAll(sourceDir, 0o755); err != nil {
        t.Fatal(err)
    }
    service := &Service{cfg: Config{SiteDir: siteDir, WorkDir: workDir, SourceDir: sourceDir}}
    if err := service.prepareBuild(os.Stderr); err != nil {
        t.Fatal(err)
    }
    if info, err := os.Stat(workDir); err != nil || !info.IsDir() {
        t.Fatalf("configured work dir was not prepared: info=%v err=%v", info, err)
    }
    if _, err := os.Stat(filepath.Join(siteDir, ".build-work")); !os.IsNotExist(err) {
        t.Fatalf("legacy workspace should not be created when WorkDir is configured: %v", err)
    }
}
''')
