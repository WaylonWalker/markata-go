{# Post actions row - copy menu, reader mode toggle, edit link #}
<div class="post-actions">
    {% include "components/post_copy.html" %}
    {% if config.components.post_meta.reader_toggle %}
    <button type="button" class="post-action post-action--reader" data-reader-toggle aria-pressed="false" title="Toggle reader mode (s)">
        <svg class="post-action__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h4A2.5 2.5 0 0 1 12 6.5v13a1 1 0 0 1-1.6.8A3 3 0 0 0 8.5 19.5h-3A1.5 1.5 0 0 1 4 18V5.5Zm8 1A2.5 2.5 0 0 1 14.5 4h4A1.5 1.5 0 0 1 20 5.5V18a1.5 1.5 0 0 1-1.5 1.5h-3a3 3 0 0 0-1.9.8 1 1 0 0 1-1.6-.8v-13ZM6 6v11.5h2.5c.53 0 1.04.1 1.5.29V6.5a.5.5 0 0 0-.5-.5H6Zm8 .5v11.29c.46-.19.97-.29 1.5-.29H18V6h-3.5a.5.5 0 0 0-.5.5Z" fill="currentColor"/></svg>
        <span class="post-action__label">Reader mode</span>
    </button>
    {% endif %}
    {% if post_edit_url %}
    <a class="post-action post-action--edit no-avatar" href="{{ post_edit_url }}" rel="nofollow noopener" target="_blank">
        <svg class="post-action__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16.9 3.6a2 2 0 0 1 2.8 0l.7.7a2 2 0 0 1 0 2.8L9.5 18H5.9v-3.6L16.9 3.6Zm1.4 1.4L7.9 15.4v.7h.7L19 5.7l-.7-.7ZM4 20h16v2H4v-2Z" fill="currentColor"/></svg>
        <span class="post-action__label">{{ config.components.post_meta.edit_label }}</span>
    </a>
    {% endif %}
</div>
